<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灵宠对决</title>
<style>html,body{margin:0;height:100%;background:#0b111d;color:#8fa3c0;font:14px -apple-system,"PingFang SC",sans-serif;display:grid;place-items:center}
#hint{opacity:.85}</style></head><body><div id="hint">正在载入最新版本…</div>
<script>
(function(){
  var SRC='https://gcore.jsdelivr.net/gh/heyilin2003-spec/lingchong-mobile@main/desktop/index.html', FALLBACK='https://heyilin2003-spec.github.io/lingchong-mobile/desktop/';
  var t=setTimeout(function(){ if(!window.__loaded){ location.replace(FALLBACK); } }, 12000);
  fetch(SRC,{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
  .then(function(h){ window.__loaded=true; clearTimeout(t);
    document.open(); document.write(h); document.close(); })
  .catch(function(e){ window.__loaded=true; clearTimeout(t);
    var d=document.getElementById('hint'); if(d) d.textContent='主通道较慢，正在切换备用线路…';
    location.replace(FALLBACK);
  });
})();
</script></body></html>
