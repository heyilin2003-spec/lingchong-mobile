<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灵宠对决</title>
<style>html,body{margin:0;height:100%;background:#0b111d;color:#8fa3c0;font:14px -apple-system,"PingFang SC",sans-serif;display:grid;place-items:center}
#hint{opacity:.85}</style></head><body><div id="hint">正在载入最新版本…</div>
<script>
(function(){
  var REPO='heyilin2003-spec/lingchong-mobile', SUB='desktop/index.html', FALLBACK='https://heyilin2003-spec.github.io/lingchong-mobile/desktop/';
  function fail(){ location.replace(FALLBACK); }
  var t=setTimeout(fail, 15000);
  fetch('./version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(v){
      var sha=(v&&v.sha)||'main';
      return fetch('https://gcore.jsdelivr.net/gh/'+REPO+'@'+sha+'/'+SUB,{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status); return r.text();
      });
    })
    .then(function(h){ clearTimeout(t); document.open(); document.write(h); document.close(); })
    .catch(function(e){ clearTimeout(t); var d=document.getElementById('hint'); if(d) d.textContent='切换到备用线路…'; setTimeout(fail,400); });
})();
</script></body></html>
